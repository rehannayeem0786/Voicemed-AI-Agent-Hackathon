# Render Blueprint — deploys VoiceMed AI as an always-on web service.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Set ASSEMBLYAI_API_KEY in the dashboard when prompted (sync: false).
services:
  - type: web
    name: voicemed-ai
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ASSEMBLYAI_API_KEY
        sync: false # set in the Render dashboard — never commit the key
